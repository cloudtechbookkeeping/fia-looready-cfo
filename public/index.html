<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Fia · LooREADY CFO</title>
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fia">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jaldi:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
  <!-- Sign in -->
  <main id="login" class="login" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <p class="eyebrow">LooREADY CFO</p>
      <h1>Fia</h1>
      <p class="muted">Sign in to ask Fia about cash, budgets and forecasts.</p>
      <label>Username
        <input id="lu" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label>Password
        <input id="lp" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginErr" class="err" role="alert"></p>
      <button class="btn-primary" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Chat -->
  <div id="app" class="app" hidden>
    <header class="top">
      <button id="menuBtn" class="icon-btn" aria-label="Chats">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="title">
        <span class="eyebrow">LooREADY CFO</span>
        <span id="threadTitle" class="t">Fia</span>
      </div>
      <button id="newBtn" class="icon-btn" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>

    <div id="installTip" class="install-tip" hidden>
      Install on your iPhone: tap <b>Share</b> <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> then <b>Add to Home Screen</b>.
      <button id="tipClose" class="link" aria-label="Dismiss">✕</button>
    </div>

    <section id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <h2>Hi, I'm Fia.</h2>
        <p class="muted">Your CFO assistant. Ask me about LooREADY's numbers.</p>
        <div class="chips">
          <button class="chip">What's our cash position right now?</button>
          <button class="chip">Summarise last month's P&amp;L</button>
          <button class="chip">How many months of runway do we have?</button>
          <button class="chip">Walk me through the 2027 factory budget</button>
        </div>
      </div>
    </section>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Ask Fia…" enterkeyhint="send" aria-label="Message"></textarea>
      <button id="sendBtn" class="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </form>
  </div>

  <!-- Chats drawer -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Chats" hidden>
    <div class="drawer-head">
      <span class="eyebrow">Signed in as</span>
      <strong id="who"></strong>
    </div>
    <button id="drawerNew" class="btn-primary small">+ New chat</button>
    <nav id="threadList" class="thread-list"></nav>
    <div class="drawer-foot">
      <button id="usersBtn" class="link" hidden>Manage users</button>
      <button id="pwBtn" class="link">Change password</button>
      <button id="logoutBtn" class="link">Sign out</button>
    </div>
  </aside>

  <!-- Bottom sheet for settings -->
  <div id="sheetScrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button id="sheetClose" class="link" aria-label="Close">Done</button></div>
    <div id="sheetBody"></div>
  </section>

  <script src="/app.js?v=2"></script>
</body>
</html>
